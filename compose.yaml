# Ports, image versions and UID are documented in .env.example and README.
x-node-build: &node-build
  context: .
  args:
    NODE_IMAGE: ${NODE_IMAGE:-node:24.19.0-bookworm-slim}
    NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.28.2-alpine}
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
services:
  migrate:
    <<: *hardening
    profiles: [app]
    build:
      <<: *node-build
      target: migrate
    image: folio-migrate:${IMAGE_TAG:-local}
    restart: 'no'
    environment:
      DATABASE_FILE_PATH: /app/data/app.sqlite
    volumes: [sqlite-data:/app/data]
  backend:
    <<: *hardening
    profiles: [app]
    build:
      <<: *node-build
      target: backend
    image: folio-backend:${IMAGE_TAG:-local}
    init: true
    stop_grace_period: 20s # Longer than the named 10-second application shutdown deadline.
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_FILE_PATH: /app/data/app.sqlite
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:operator@example.com}
    volumes: [sqlite-data:/app/data]
  frontend:
    <<: *hardening
    profiles: [app]
    build:
      <<: *node-build
      target: frontend
    image: folio-frontend:${IMAGE_TAG:-local}
    depends_on:
      backend:
        condition: service_healthy
    ports: ['127.0.0.1:${FRONTEND_PORT:-8080}:8080']
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
      NGINX_PORT: '8080'
      BACKEND_ORIGIN: http://backend:3001
      PROXY_TIMEOUT: 30s
      ASSET_MAX_AGE: 31536000
    command: ['nginx', '-g', 'daemon off;', '-c', '/etc/nginx/nginx.conf']
    # Main nginx config includes /tmp/default.conf, so templating works with a read-only root.
    volumes: [./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
volumes:
  sqlite-data:
