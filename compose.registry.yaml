# Run from this source directory: docker compose --env-file push.env -f compose.registry.yaml up -d
# The registry image tags must have been built and pushed for this release.
services:
  migrate:
    image: ${FOLIO_REGISTRY:-192.168.1.11:5000}/folio-migrate:${IMAGE_TAG:-1.14.1}
    platform: linux/arm64
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    environment:
      DATABASE_FILE_PATH: /app/data/app.sqlite
    volumes: [sqlite-data:/app/data]
  backend:
    image: ${FOLIO_REGISTRY:-192.168.1.11:5000}/folio-backend:${IMAGE_TAG:-1.14.1}
    platform: linux/arm64
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ['127.0.0.1:${BACKEND_PORT:-5001}:3001']
    environment:
      DATABASE_FILE_PATH: /app/data/app.sqlite
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8081}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:operator@example.com}
    volumes: [sqlite-data:/app/data]
  frontend:
    image: ${FOLIO_REGISTRY:-192.168.1.11:5000}/folio-frontend:${IMAGE_TAG:-1.14.1}
    platform: linux/arm64
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    depends_on:
      backend:
        condition: service_healthy
    ports: ['127.0.0.1:${FRONTEND_PORT:-8081}:8080']
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
      NGINX_PORT: '8080'
      BACKEND_ORIGIN: http://backend:3001
      PROXY_TIMEOUT: 30s
      ASSET_MAX_AGE: 31536000
    command: ['nginx', '-g', 'daemon off;', '-c', '/etc/nginx/nginx.conf']
    volumes: [./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
volumes:
  sqlite-data:
